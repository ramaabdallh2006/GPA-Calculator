<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المعدل التراكمي - جامعة ماري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ترويسة الجامعة -->
        <div class="uni-header">
            <h1>حاسبة المعدل التراكمي (GPA)</h1>
            <p>جامعة ماري – وفق النظام الامتحاني والساعات المعتمدة</p>
        </div>

        <!-- حقول الإدخال -->
        <div class="input-group">
            <input type="text" id="subjectName" placeholder="اسم المادة (مثلاً: برمجة 2)">
            <input type="number" id="subjectGrade" placeholder="العلامة (من 100)" min="0" max="100">
            <input type="number" id="subjectHours" placeholder="عدد الساعات" min="1" max="6">
        </div>
        <button id="addBtn" class="add-btn">إضافة المادة</button>

        <!-- جدول المواد -->
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>العلامة</th>
                    <th>الساعات</th>
                    <th>النقاط</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="subjectsList"></tbody>
        </table>

        <!-- زر الحساب وصندوق النتيجة -->
        <button id="calcBtn">احسب المعدل التراكمي</button>
        <div class="result-box">
            <h2 id="result">المعدل: --</h2>
            <h3 id="gradeText">التقدير: --</h3>
        </div>

        <!-- توقيع المطورة -->
        <div class="footer">
            تصميم وبرمجة: <strong>م. راما عبدالله</strong> – قسم الهندسة المعلوماتية 💻
        </div>
    </div>

    <!-- ربط ملف الجافاسكربت الخارجي -->
    <script src="script.js"></script>
</body>
</html>
